name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match production: Neon runs PostgreSQL 18. Testing a different major than you
        # ship on means CI can pass while production breaks (and vice versa).
        image: postgres:18-alpine
        env:
          POSTGRES_DB: screenshut_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d screenshut_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      # Let every leg finish. With the default fail-fast, one leg failing cancels the
      # others mid-run — which cancelled 8.4 (the leg that carries the PostgreSQL job)
      # because of an unrelated static-analysis failure on 8.5, hiding the pgsql result
      # entirely.
      fail-fast: false
      matrix:
        # 8.4 is the floor: composer.json requires ^8.4 (laravel/framework 13 pulls
        # symfony/filesystem, which needs >= 8.4.1 — on 8.3 composer's platform check fatals
        # before the app can boot at all).
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Fails the build on a known-vulnerable dependency. Caught guzzlehttp/guzzle 7.13.1
      # (6 advisories, one high) and league/commonmark sitting in the lock file unnoticed.
      - name: Audit Dependencies
        run: composer audit --no-interaction

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Run Tests
        run: php artisan test

      - name: Run PostgreSQL device and workflow tests
        if: matrix.php-version == '8.4'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: screenshut_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate:fresh --force
          php artisan test \
            tests/Feature/PostgresSocialConcurrencyTest.php \
            tests/Feature/UnifiedDeviceLifecycleTest.php \
            tests/Feature/TelemetryApiTest.php \
            tests/Feature/WorkflowDurabilityTest.php \
            tests/Feature/Api/V1/AuthApiTest.php \
            tests/Feature/Api/V1/ChangeEmailApiTest.php \
            tests/Feature/Api/V1/PushTokenApiTest.php \
            tests/Feature/Api/V1/SessionApiTest.php \
            tests/Feature/Api/V1/SocialAuthTest.php \
            tests/Feature/Api/V1/TwoFactorLoginChallengeTest.php
