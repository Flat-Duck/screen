# nginx site for akukas.ly — origin behind Cloudflare (proxied / orange cloud).
#
# Install:
#   sudo cp deploy/nginx/akukas.ly.conf /etc/nginx/sites-available/akukas.ly
#   sudo ln -sf /etc/nginx/sites-available/akukas.ly /etc/nginx/sites-enabled/akukas.ly
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depends on /etc/nginx/conf.d/cloudflare-realip.conf — generate it FIRST with
# deploy/nginx/cloudflare-realip.sh, or every client IP will be a Cloudflare address and
# the auth rate limiters will throttle all visitors as one.

# Port 80 exists only as a redirect. Cloudflare "Always Use HTTPS" should mean nothing
# reaches it, but an origin that quietly serves plaintext is worth closing off.
server {
    listen 80;
    listen [::]:80;
    server_name akukas.ly www.akukas.ly;
    return 301 https://akukas.ly$request_uri;
}

# Send www to the apex so sessions (SESSION_DOMAIN=.akukas.ly) and passkeys
# (relying-party ID derived from APP_URL) have exactly one canonical origin.
server {
    # `listen ... http2` rather than the newer `http2 on;` directive: Ubuntu 24.04 ships
    # nginx 1.24, where `http2 on;` is an unknown directive and the config fails to load
    # outright. This form works on 1.9.5+ including current releases.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.akukas.ly;

    ssl_certificate     /etc/ssl/cloudflare/akukas.ly.pem;
    ssl_certificate_key /etc/ssl/cloudflare/akukas.ly.key;

    return 301 https://akukas.ly$request_uri;
}

server {
    # `listen ... http2` rather than the newer `http2 on;` directive: Ubuntu 24.04 ships
    # nginx 1.24, where `http2 on;` is an unknown directive and the config fails to load
    # outright. This form works on 1.9.5+ including current releases.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akukas.ly;

    root /var/www/akukas/public;
    index index.php;

    charset utf-8;

    # Cloudflare Origin Certificate — free, 15-year, trusted only by Cloudflare.
    # Pair with SSL/TLS mode "Full (strict)" in the dashboard. A Let's Encrypt cert would
    # also work, but HTTP-01 issuance has to negotiate the proxy on every renewal; this
    # does not.
    ssl_certificate     /etc/ssl/cloudflare/akukas.ly.pem;
    ssl_certificate_key /etc/ssl/cloudflare/akukas.ly.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must exceed post_max_size (14M), which itself exceeds
    # SOCIAL_UPLOADS_MAX_SIZE_BYTES (10M). Cloudflare's own Free-plan ceiling is 100M,
    # so this is the binding limit.
    client_max_body_size 14M;

    # AppServiceProvider::boot() calls URL::forceScheme('https') unconditionally, so the
    # app always generates https URLs; this keeps Laravel's own view of the request in sync.
    fastcgi_param HTTPS on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Above config/social.php's SOCIAL_MEDIA_JOB_TIMEOUT_SECONDS (60) so a slow
        # upload/OCR round trip is not cut off mid-request.
        fastcgi_read_timeout 90s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Never expose dotfiles, but leave ACME's path reachable in case you ever switch
    # to Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/akukas.access.log;
    error_log  /var/log/nginx/akukas.error.log;
}
