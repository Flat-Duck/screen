; Pulse server metrics — samples this host's CPU, memory, and disk for the "Servers" card.
; One process PER SERVER; each reports under PULSE_SERVER_NAME (defaults to gethostname()).
;
; Purely supplementary: without it every other Pulse card still works, you just lose host metrics.
[program:screenshut-pulse-check]
process_name=%(program_name)s
command=/usr/bin/php8.4 /var/www/akukas/artisan pulse:check
directory=/var/www/akukas
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/screenshut-pulse-check.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
