; Pulse ingest worker — REQUIRED whenever PULSE_INGEST_DRIVER=redis (the production default in
; .env.production.example). Requests push entries onto a Redis stream instead of writing to
; PostgreSQL inline; this process drains that stream into the pulse_* tables.
;
; Without it, Pulse silently records nothing: the dashboard stays empty and the Redis stream grows
; until PULSE_INGEST_KEEP trims it. That failure is quiet, so treat this process as load-bearing,
; not optional.
[program:screenshut-pulse-work]
process_name=%(program_name)s
command=/usr/bin/php8.4 /var/www/akukas/artisan pulse:work
directory=/var/www/akukas
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/screenshut-pulse-work.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
