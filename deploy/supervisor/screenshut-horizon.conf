; Horizon — owns ALL queue processing for this app.
;
; Do NOT also run `queue:work`; QUEUE_CONNECTION=redis and config/horizon.php defines three
; supervisors (supervisor-default, supervisor-security, supervisor-media) that map 1:1 to the
; queues jobs declare via onQueue(). A stray queue:work would double-consume the same queues.
;
; PHP path is absolute and pinned to 8.4: composer.json requires ^8.4 (symfony/filesystem needs
; >= 8.4.1) and a bare `php` on this host may still resolve to 8.2/8.3, which fatals on Composer's
; platform check before the app can boot.
;
; stopwaitsecs must exceed the longest job timeout so in-flight jobs finish on restart rather than
; being killed mid-run — SOCIAL_MEDIA_JOB_TIMEOUT_SECONDS is 60 by default.
[program:screenshut-horizon]
process_name=%(program_name)s
command=/usr/bin/php8.4 /var/www/screenshut-telemetry/artisan horizon
directory=/var/www/screenshut-telemetry
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/screenshut-horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
